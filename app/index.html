<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bayit · A little more together</title>
    <meta name="theme-color" content="#FEFAF5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bayit" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand-selected-20261107/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/brand-selected-20261107/app-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=brand-20261107-a" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Selected sketch/paper loading surface: readiness is controlled by the app. -->
    <link rel="stylesheet" href="/src/boot-splash.css" />
    <div id="splash" role="status" aria-live="polite">
      <canvas class="boot-sketch" aria-hidden="true"></canvas>
      <div class="boot-content">
        <img class="boot-logo boot-logo-day" src="/assets/brand-selected-20261107/logo-light-alpha.png" alt="Bayit" />
        <img class="boot-logo boot-logo-night" src="/assets/brand-selected-20261107/logo-dark-alpha.png" alt="Bayit" />
        <h1 class="boot-title"><span class="boot-prefix">A little more</span> <span class="boot-end"><span class="boot-word">together.</span><img class="boot-u" src="/assets/generated/title-underline-clean.png" alt="" /><img class="boot-r" src="/assets/generated/title-rays.png" alt="" /></span></h1>
        <p class="boot-status">Opening Bayit…</p>
        <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      (function(){
        var s=document.getElementById('splash'),root=document.documentElement,timer=0;
        function get(key,fallback){try{var value=JSON.parse(localStorage.getItem(key));return value==null?fallback:value}catch(e){return fallback}}
        var theme=get('bayit-theme','light')==='dark'?'dark':'light',lang=get('bayit-lang','en')==='he'?'he':'en';
        root.dataset.theme=theme;root.lang=lang;root.dir=lang==='he'?'rtl':'ltr';
        if(get('bayit-reduce-motion',false)||matchMedia('(prefers-reduced-motion:reduce)').matches)root.dataset.motion='reduced';
        document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#10152A':'#FEFAF5';
        if(lang==='he'){s.querySelector('.boot-prefix').textContent='קצת יותר';s.querySelector('.boot-word').textContent='ביחד.';s.querySelector('.boot-status').textContent='פותחים את Bayit…'}
        window.__bayitSplash={visible:true,hide:function(){clearTimeout(timer);this.visible=false;s.classList.add('sp-out');s.setAttribute('aria-hidden','true');dispatchEvent(new Event('bayit:splash-hide'));timer=setTimeout(function(){if(!window.__bayitSplash.visible)s.style.display='none'},root.dataset.motion==='reduced'?0:180)},show:function(){clearTimeout(timer);this.visible=true;s.style.display='';s.classList.remove('sp-out');s.removeAttribute('aria-hidden');dispatchEvent(new Event('bayit:splash-show'))}};
      })();
    </script>
    <script type="module" src="/assets/shell-20261107/boot-splash.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
