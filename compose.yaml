# Bayit with Docker. Copy .env.example to .env, fill it in, then: docker compose up -d --build
# Your data (database, files, generated installation secrets) lives in the "bayit-data" volume. Back it up.
# For HTTPS on your own domain, also start Caddy: docker compose --profile https up -d
services:
  bayit:
    build:
      context: .
      dockerfile: app/host/Dockerfile
    image: bayit:local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Quoted: in a YAML [list] a bare comma starts a new entry, which Docker refuses ("invalid mount path: 'mode=1777'").
    tmpfs: ["/tmp:size=32m,mode=1777"]
    environment:
      BAYIT_ORIGIN: ${BAYIT_ORIGIN:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BAYIT_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - bayit-data:/data

  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${BAYIT_DOMAIN:-localhost} --to bayit:8080
    volumes:
      - caddy-data:/data
    depends_on:
      - bayit

volumes:
  bayit-data:
  caddy-data:
