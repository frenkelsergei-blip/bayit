# Bayit with Docker. Copy .env.example to .env, fill it in, then: docker compose up -d --build
# Your data (database, files, generated installation secrets) lives in the "bayit-data" volume. Back it up.
# For HTTPS on your own domain, also start Caddy: docker compose --profile https up -d
services:
  bayit:
    build:
      context: .
      dockerfile: app/host/Dockerfile
    image: bayit:local
    restart: unless-stopped
    ports:
      - "${BAYIT_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - bayit-data:/data

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${BAYIT_DOMAIN:-localhost} --to bayit:8080
    volumes:
      - caddy-data:/data
    depends_on:
      - bayit

volumes:
  bayit-data:
  caddy-data:
