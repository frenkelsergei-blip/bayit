name: Security and release checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '25 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run test:domain
        working-directory: app
      - run: npm audit --audit-level=moderate && npm sbom --sbom-format=cyclonedx > ../dependency-sbom.json
        working-directory: app
      - run: npm run build:pages && npm run test:sites && node host/build-host.mjs
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-sbom
          path: dependency-sbom.json
          retention-days: 14
  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f app/host/Dockerfile -t bayit-security-ci .
      - run: docker save bayit-security-ci --output /tmp/bayit-security-ci.tar
      - run: chmod 0644 /tmp/bayit-security-ci.tar
      - name: Scan the image archive without access to the Docker socket
        run: >-
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,size=512m --mount type=volume,source=trivy-cache,target=/root/.cache
          --mount type=bind,source=/tmp/bayit-security-ci.tar,target=/input/image.tar,readonly
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --input /input/image.tar --scanners vuln --exit-code 1 --severity MEDIUM,HIGH,CRITICAL
