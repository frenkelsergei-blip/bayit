name: Feature idea
description: Suggest something that would help your family.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would help?
      description: The situation at home and what's hard today. Real stories help more than solutions.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working, in Hebrew and English if it adds text.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd like to work on this myself.
